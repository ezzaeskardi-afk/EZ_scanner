name: Bug report
description: Something behaves differently from what the README says
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Two commands answer most of what this form asks, and their output is the fastest road to a
        fix: `ezscan doctor` (what does this line do?) and `ezscan selftest` (is it my line or my
        settings?). Please paste their output rather than summarising it.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you ran, what you expected, what actually happened.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `ezscan doctor`
      description: It measures the line and names the preset it needs, including the throughput row.
      render: text
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: The exact command, or the GUI settings
      description: For a scan, the flags (or the preset and the settings panel) and the source you scanned.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: "`ezscan --version`, or the release you downloaded."
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Node.js version and operating system
      placeholder: Node 22.18 on Windows 11
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log lines
      description: The GUI's *Live log* tab, or the terminal output. Lines from the speed phase name the verdict that stopped a measurement.
      render: text
  - type: checkboxes
    id: before
    attributes:
      label: Before submitting
      options:
        - label: I read the FAQ in README.md
          required: true
        - label: I am not pasting my own UUID, password or a private SNI (mask them)
          required: true
        - label: I am running Node.js 22.18 or newer
          required: true
