name: Release

# Releases used to be assembled by hand: the zip was built on a laptop and the notes were
# typed into the GitHub form, so nothing tied a release to the commit it described. Pushing
# a `v*` tag now does the whole thing: verify, package the tracked files, publish.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)publish
        required: true
      reset-notes:
        description: 'Overwrite even hand-corrected notes with the tag''s changelog'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # No race reaches a published artifact: the tag's own commit is hunted before anything is
  # packaged — six passes over the integration files with three of the runner's four CPUs made
  # busy (the 1.7.6 manual hunt under that exact load ran each pass in ~73s, so this adds about
  # eight minutes to a release that already spends three on the suite). `workflow_call` cannot
  # take a ref and `uses` resolves the called workflow from the CALLER's commit, so the hunt
  # runs the caller's own copy of the hunt script — and `ref:` makes its *workspace* the tag's
  # tree, so the commit under the hammer is the commit being shipped. A red hunt fails the
  # release; the tag is not rewritten — the fix lands on `main` and the next tag carries it,
  # or the release is re-dispatched on the same tag once the flake is understood, which re-runs
  # the hunt too.
  hunt:
    name: flake hunt on the tagged commit
    uses: ./.github/workflows/flake.yml
    with:
      runs: '6'
      load: '3'
      ref: ${{ github.event.inputs.tag || github.ref }}

  publish:
    name: verify, package and publish
    needs: hunt
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # A release is the one artifact users download, so the tag has to pass the same gate
      # as `main` before anything is published.
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run check:deadcode
      - run: npm test
        timeout-minutes: 5

      - name: Package the tracked files
        run: |
          VERSION="${TAG#v}"
          git archive --format=zip --prefix=ez-scanner/ -o "ez-scanner-${VERSION}.zip" HEAD
          sha256sum "ez-scanner-${VERSION}.zip" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Notes from the changelog
        run: |
          npm run --silent notes -- "${TAG#v}" > notes.md
          head -5 notes.md
      # The tag is frozen, so the notes it extracts are deterministic: on a re-publish of a
      # release whose body was hand-corrected after publishing (as 1.7.6's was — its "no file
      # under src/ changes" claim was wrong and fixed on the release and on main, while the tag
      # still carries the original wording), overwriting would regress the published notes.
      # A body that differs from the extraction IS the correction, so it is kept verbatim;
      # `reset-notes` is the explicit way to say the changelog now supersedes it.
      - name: Preserve hand-corrected notes
        if: github.event_name == 'workflow_dispatch' && !inputs.reset-notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" --json body --jq '.body' > published.md 2>/dev/null; then
            if ! diff -q published.md notes.md >/dev/null 2>&1; then
              cp published.md notes.md
              echo "keeping the published body — it was hand-corrected after this tag shipped"
              echo "(pass reset-notes=true to overwrite it with the tag's changelog)"
            else
              echo "published body matches the tag's changelog; nothing to preserve"
            fi
          else
            echo "no existing release to compare against; publishing the extracted notes"
          fi

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${TAG#v}"
          gh release create "$TAG" \
            --title "EZ Scanner $VERSION" \
            --notes-file notes.md \
            "ez-scanner-${VERSION}.zip" SHA256SUMS.txt \
          || {
            # Re-running a tag (a fix on top, or workflow_dispatch) has to replace the notes
            # too: `release upload` only swaps the assets, which left the published notes
            # behind the changelog they were extracted from.
            gh release upload "$TAG" "ez-scanner-${VERSION}.zip" SHA256SUMS.txt --clobber
            gh release edit "$TAG" --title "EZ Scanner $VERSION" --notes-file notes.md
          }
          gh release view "$TAG" --json tagName,isDraft,url --jq '.tagName + " " + (.isDraft|tostring) + " " + .url'
