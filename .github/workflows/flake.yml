name: Flake hunt

# A race passes a single quiet pass by construction, which is how 1.7.4 shipped a test that failed
# on a runner while passing everywhere the suite was run once in a row (the assertion and its fix
# are in the 1.7.5 notes). This job is that suite, repeated while its CPU is being taken away,
# which is the only cheap way to meet such a failure.
#
# Nightly rather than part of CI on purpose: repeated integration runs on every push cost more than
# the answer is worth, and a flake should not block a push — it should be *known*. The nightly is
# the cheap floor (3 passes, load 2); Sunday night widens the net (30 passes, load 3 — the scale
# that caught the burst precondition flake in the 1.7.6 A/B experiment) for the races too rare to
# meet in a single night. Run it by hand when a test looks suspicious:
#
#   gh workflow run flake.yml -f runs=6
#   gh workflow run flake.yml -f files=test/server.test.ts -f runs=20      # one suspect file
#
# The release workflow also calls this (`workflow_call`) on the tag's own commit, with more passes
# and a busier machine, and does not publish the release until it is green.
on:
  schedule:
    # Nightly: the cheap floor — three passes at load 2.
    - cron: '17 3 * * *'
    # Sunday night: the heavy hunt — thirty passes at load 3, for the races too rare to meet in a
    # single night. A race that fails ~4 passes in 30 shows up in the nightly about a third of
    # nights; at thirty passes a week it is near-certain, for one 40-minute run rather than a
    # wider hunt every day.
    - cron: '47 4 * * 0'
  workflow_call:
    inputs:
      runs:
        description: Passes over the suite
        type: string
        default: '3'
      files:
        description: Comma-separated files, instead of the integration suite
        type: string
        default: ''
      load:
        description: Busy processes to add (default 2, about half a runner)
        type: string
        default: ''
      ref:
        description: 'Commit, tag or branch to hunt; default is the caller''s own ref'
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      runs:
        description: Passes over the suite
        default: '3'
      files:
        description: Comma-separated files, instead of the integration suite
        default: ''
      load:
        description: Busy processes to add (default 2, about half a runner)
        default: ''

permissions:
  contents: read

jobs:
  hunt:
    name: integration suite, repeated under load
    runs-on: ubuntu-latest
    # Three passes, with two busy processes on a 4-vCPU runner: enough taken away to expose the
    # races this exists for, and still inside the timeout with room for a slow pass. The script's
    # own default is hard (one busy process per CPU but one), which is right on a developer's
    # machine and wrong on a runner — there a starved pass reads as a timeout rather than a flake.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          # Inside a called workflow this job gets a *fresh* workspace, and a bare checkout takes
          # `github.sha` — the ref the caller RAN on, not the one it checked out. A release passes
          # its tag here explicitly, so the commit under the hammer is the commit being shipped.
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - name: Flake hunt
        shell: bash
        env:
          # A manual dispatch or the release gate says what it wants. A scheduled run carries no
          # inputs, and the cron string is the only way it can say which schedule it is — the
          # nightly falls back to the cheap default, the Sunday cron to the heavy one.
          RUNS: ${{ inputs.runs || (github.event.schedule == '47 4 * * 0' && 30 || 3) }}
          FILES: ${{ inputs.files }}
          LOAD: ${{ inputs.load || (github.event.schedule == '47 4 * * 0' && 3 || 2) }}
          FLAKE_HUNT_RESULTS: ${{ github.workspace }}/flake-hunt-results.json
        run: |
          args=(--runs "$RUNS")
          if [ -n "$FILES" ]; then args+=(--files "$FILES"); fi
          if [ -n "$LOAD" ]; then args+=(--load "$LOAD"); fi
          node scripts/flake-hunt.ts "${args[@]}"
      # The evidence outlives the job log: every pass as measured, plus the verdict once the
      # hunt can make one. Uploaded even on failure — a red hunt is exactly the one whose file
      # is worth keeping — and a missing file is a broken hunt, not a broken upload.
      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flake-hunt-results
          path: flake-hunt-results.json
          if-no-files-found: error
