name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # The fast lane: two greps, seconds long, before the matrix spends minutes. Same contracts
  # test/workflow-contracts.test.ts pins — the grep is the fail-fast twin, so a regression is
  # named in the first seconds of the run instead of after the suite. The hunted label and
  # any pre-v5 action ref fail here; the character class below (`ubuntu[-]latest`) keeps this
  # file itself clean of the literal, so the contracts test never trips on its own twin.
  workflow_contracts:
    name: workflow contracts (fast grep)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5
      - name: runner labels and action refs
        run: |
          # Both hunts refuse to name their own quarry: the character class keeps this file
          # clean of the label literal, and the pre-v5 pattern anchors the ref at end of line
          # so it matches real `uses:` refs, never the regex text in this very grep.
          ! grep -rn "ubuntu[-]latest" .github/workflows/
          ! grep -rE "uses: actions/[a-z-]+@v[0-4]$" .github/workflows/ | grep .
          if grep -rE "uses: actions/[a-z-]+@v[0-4]$" .github/workflows/ | grep -q .; then
            echo "::error::pre-v5 action refs found (node 20 runtime)"; exit 1
          fi
  check:
    name: typecheck + tests (node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, windows-latest]
        node: ['22.18', '24']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      # Named steps so a dead export / unused token / unused i18n key, or a vendored
      # stylesheet that grew back or lost a pinned asset, is obvious in the job list
      # instead of being one line of a 17s test log. Also part of `npm test`.
      - run: npm run check:deadcode
        timeout-minutes: 2
      - run: npm run check:openui-css
        timeout-minutes: 2
      - name: Tests
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.log
        timeout-minutes: 5
      # The job log needs admin rights to fetch through the API, so the failing lines are
      # also posted as annotations, where the commit and a PR both show them. The TAP `error:`
      # line is included so an assertion's own message travels with the annotation — a budget
      # breach should name its numbers, not `expected: true, actual: false`.
      - name: Surface the failing tests
        if: failure()
        shell: bash
        run: |
          grep -aE "^(✖|not ok)|^  error: '|AssertionError|Error \[|✖ test" test-output.log \
            | head -12 \
            | while IFS= read -r line; do echo "::error::$(printf '%s' "$line" | tr -d '\r')"; done
          echo "::error::summary: $(grep -aE '^ℹ (tests|pass|fail)' test-output.log | tr '\n' ' ')"

  smoke:
    name: real-edge smoke test
    runs-on: ubuntu-26.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - run: node src/cli/main.ts scan --preset fast --count 30 --sni www.cloudflare.com --no-color --print 5
