name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: typecheck + tests (node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22.18', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      # Named steps so a dead export / unused token / unused i18n key, or a vendored
      # stylesheet that grew back or lost a pinned asset, is obvious in the job list
      # instead of being one line of a 17s test log. Also part of `npm test`.
      - run: npm run check:deadcode
        timeout-minutes: 2
      - run: npm run check:openui-css
        timeout-minutes: 2
      - name: Tests
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.log
        timeout-minutes: 5
      # The job log needs admin rights to fetch through the API, so the failing lines are
      # also posted as annotations, where the commit and a PR both show them.
      - name: Surface the failing tests
        if: failure()
        shell: bash
        run: |
          grep -aE "^(✖|not ok)|AssertionError|Error \[|✖ test" test-output.log \
            | head -12 \
            | while IFS= read -r line; do echo "::error::$(printf '%s' "$line" | tr -d '\r')"; done
          echo "::error::summary: $(grep -aE '^ℹ (tests|pass|fail)' test-output.log | tr '\n' ' ')"

  smoke:
    name: real-edge smoke test
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - run: node src/cli/main.ts scan --preset fast --count 30 --sni www.cloudflare.com --no-color --print 5
